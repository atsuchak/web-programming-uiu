<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring 26-A Js</title>
</head>
<body>
    <label for="">Subject Name: </label>
    <input type="text" id="input1"> <br><br>

    <label for="">Study Hours: </label>
    <input type="text" id="input2"> <br><br>

    <button onclick="pass()">Add Study</button>

    <p id="output"></p>


    <script>
        let goal = 20, total = 0, cnt = 0
        let sub = []

        function pass() {
            cnt++

            let input1 = document.getElementById('input1').value
            sub.push(input1)

            let input2 = Number(document.getElementById('input2').value)
            total += input2

            let avg = total / cnt

            let feedback = ""
            if(total >= 0 && total <= 5) feedback = "Start studying regularly!"
            else if(total >= 6 && total <= 12) feedback = "Good progress!"
            else if(total >= 13 && total <= 19) feedback = "Almost ready!"
            else if(total >= 20) feedback = "Weekly goal reached!"

            if(cnt > 7) feedback = "Increase your study time!"

            document.getElementById('output').innerText = `Total: ${total} hours, Average: ${avg} hours, Subjects: [${sub}], ${feedback}`

            document.getElementById('input1').value = ""
            document.getElementById('input2').value = ""
        }
    </script>
</body>
</html>
